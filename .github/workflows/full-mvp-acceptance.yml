name: Full synthetic MVP acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
        env:
          POSTGRES_USER: udc_dev
          POSTGRES_DB: udc_qa_control
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U udc_dev -d udc_qa_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Install isolated test dependencies
        run: >-
          python -m pip install 'pytest>=8,<9' 'fastapi==0.115.14'
          'pydantic>=2.11,<3' 'httpx>=0.28,<0.29'
          'pandas>=2.2,<3' 'rapidfuzz>=3.14,<4'
          'comtradeapicall==1.3.2' requests
          -r services/document_extractor/requirements.txt
      - name: Run every synthetic MVP suite and produce capability report
        run: node scripts/acceptance/full-mvp.mjs
        env:
          UDC_QA_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-mvp-synthetic-evidence
          path: .acceptance-results/full-mvp-*/
          include-hidden-files: true
          if-no-files-found: error
