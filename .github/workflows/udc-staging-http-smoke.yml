name: UDC staging HTTP smoke (fictional accounts)

on:
  pull_request:
    paths:
      - ".github/workflows/udc-staging-http-smoke.yml"
      - "artifacts/api-server/test/stagingHttpSmoke.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-auth-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test isolated staging API with fictional buyer, seller and agent
        run: node artifacts/api-server/test/stagingHttpSmoke.mjs
