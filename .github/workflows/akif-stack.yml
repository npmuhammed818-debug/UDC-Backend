name: AKIF stack

on:
  pull_request:
    paths:
      - "artifacts/api-server/**"
      - "services/akif-worker/**"
      - "services/document_extractor/**"
      - "services/hermes-learning/**"
      - "docker-compose.hermes.yml"
      - ".github/workflows/akif-stack.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/api-server/**"
      - "services/akif-worker/**"
      - "services/document_extractor/**"
      - "services/hermes-learning/**"
      - "docker-compose.hermes.yml"
      - ".github/workflows/akif-stack.yml"

jobs:
  api-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  worker-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q services/akif-worker/app services/akif-worker/tests
      - run: pip install 'pytest>=8,<9' 'fastapi>=0.115,<1' 'pydantic>=2.11,<3'
      - run: PYTHONPATH=services/akif-worker python -m pytest services/akif-worker/tests/test_reasoning.py -q

  document-extractor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/document_extractor/requirements.txt 'pytest>=8,<9' 'httpx>=0.28,<1'
      - run: PYTHONPATH=services/document_extractor python -m pytest services/document_extractor/tests -q

  hermes-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: HERMES_AKIF_API_KEY=test-only-key docker compose -f docker-compose.hermes.yml config
