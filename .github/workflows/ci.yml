name: UDC verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run release:verify
      - run: pnpm run acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sow-regression-report
          path: .acceptance-results/

  email-auth-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
        env:
          POSTGRES_USER: udc_dev
          POSTGRES_DB: udc_qa_email_auth
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U udc_dev -d udc_qa_email_auth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Initialize dedicated fictional-account schema
        run: pnpm --filter @workspace/db run push
        env:
          SUPABASE_DATABASE_URL: postgresql://udc_dev@127.0.0.1:5432/udc_qa_email_auth?sslmode=disable
          SUPABASE_DIRECT_URL: postgresql://udc_dev@127.0.0.1:5432/udc_qa_email_auth?sslmode=disable
      - name: Verify email ownership and recovery with mocked mail and real PostgreSQL
        run: |
          set -o pipefail
          node artifacts/api-server/test/integration/email-auth-postgres.mjs 2>&1 | tee email-auth-postgres.log
        env:
          UDC_EMAIL_QA_DATABASE_URL: postgresql://udc_dev@127.0.0.1:5432/udc_qa_email_auth?sslmode=disable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: email-auth-postgres-report
          path: email-auth-postgres.log
