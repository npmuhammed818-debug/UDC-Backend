openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: database
    description: Database connectivity operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns the UDC service status
      responses:
        "200":
          description: Healthy
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /db/healthz:
    get:
      operationId: databaseHealthCheck
      tags: [database]
      summary: Database connectivity check
      description: Checks whether the backend can reach the configured Supabase PostgreSQL database
      responses:
        "200":
          description: Database is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseHealthStatus"
        "503":
          description: Database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseHealthStatus"
components:
  schemas:
    HealthStatus:
      type: string
      example: UDC is running
    DatabaseHealthStatus:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
      required:
        - status
        - database

