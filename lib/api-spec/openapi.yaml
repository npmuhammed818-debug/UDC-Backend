openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: database
    description: Database connectivity operations
  - name: whatsapp
    description: WhatsApp-first intake operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns the UDC service status
      responses:
        "200":
          description: Healthy
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /db/healthz:
    get:
      operationId: databaseHealthCheck
      tags: [database]
      summary: Database connectivity check
      description: Checks whether the backend can reach the configured Supabase PostgreSQL database
      responses:
        "200":
          description: Database is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseHealthStatus"
        "503":
          description: Database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseHealthStatus"
  /whatsapp/buyer-intake:
    post:
      operationId: createWhatsappBuyerIntake
      tags: [whatsapp]
      summary: Record a buyer requirement from a WhatsApp conversation
      description: Creates a buyer requirement awaiting manual UDC administrator review. It does not match sellers or approve a party automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsappBuyerIntake"
      responses:
        "201":
          description: Requirement received for manual review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappBuyerIntakeResponse"
        "400":
          description: Invalid intake details
components:
  schemas:
    HealthStatus:
      type: string
      example: UDC is running
    DatabaseHealthStatus:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
      required:
        - status
        - database
    WhatsappBuyerIntake:
      type: object
      required: [phone, fullName, quantity, destination]
      properties:
        phone:
          type: string
        fullName:
          type: string
        product:
          type: string
          default: Copper scrap
        quantity:
          type: number
        unit:
          type: string
          default: MT
        targetPrice:
          type: number
        currency:
          type: string
          default: USD
        destination:
          type: string
        incoterm:
          type: string
    WhatsappBuyerIntakeResponse:
      type: object
      required: [status, requirementId, reviewStatus, message]
      properties:
        status:
          type: string
          example: received
        requirementId:
          type: string
          format: uuid
        reviewStatus:
          type: string
          example: pending_admin_review
        message:
          type: string
