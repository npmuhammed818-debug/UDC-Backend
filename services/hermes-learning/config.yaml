skills:
  write_approval: true
  guard_agent_created: true

memory:
  memory_enabled: true
  user_profile_enabled: false
  write_approval: true
  memory_char_limit: 2200

display:
  memory_notifications: verbose

# Hermes API is used only as AKIF's learning/skills layer. Keep its exposed
# tool surface intentionally narrow even though the service itself is
# protected by bearer authentication.
platform_toolsets:
  api_server:
    - skills
    - memory
    - session_search

agent:
  # GPT-6 Luna supports function calling on Chat Completions with reasoning
  # effort set to none. AKIF's trade policy/decision logic stays in UDC.
  reasoning_effort: none
  disabled_toolsets:
    - terminal
    - browser
    - file
    - code_execution
    - connections
    - cronjob
    - computer_use
    - web

tool_loop_guardrails:
  non_interactive_hard_stop_enabled: true

# OpenAI is AKIF Hermes' primary conversational intelligence provider.
# The secret is injected only by Render as OPENAI_API_KEY.
model:
  provider: openai
  default: gpt-6-luna
  base_url: ""
  api_mode: chat_completions

# If OpenAI is temporarily unavailable or the account is out of API credit,
# Hermes can still attempt the already-configured OpenRouter route for the
# current turn instead of making WhatsApp completely silent.
fallback_providers:
  - provider: openrouter
    model: nvidia/nemotron-3-ultra-550b-a55b:free

# Auxiliary tasks may use the active provider. The previous free-only gate
# rejected valid fallback routing and caused title-generation warnings.
auxiliary:
  free_only: false

gateway:
  api_server:
    enabled: true
    port: 8642
    host: 0.0.0.0
    model_name: akif-hermes
    max_concurrent_runs: 2
