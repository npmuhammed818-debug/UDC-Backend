skills:
  write_approval: true
  guard_agent_created: true

memory:
  memory_enabled: true
  user_profile_enabled: false
  write_approval: true
  memory_char_limit: 2200

display:
  memory_notifications: verbose

# Hermes API is used only as AKIF's learning/skills layer. Keep its exposed
# tool surface intentionally narrow even though the service itself is
# protected by bearer authentication.
platform_toolsets:
  api_server:
    - skills
    - memory
    - session_search

agent:
  disabled_toolsets:
    - terminal
    - browser
    - file
    - code_execution
    - connections
    - cronjob
    - computer_use
    - web

tool_loop_guardrails:
  non_interactive_hard_stop_enabled: true

# Route development requests across compatible free models so one upstream
# model's shared-pool rate limit does not halt all conversation. The API key is supplied only through Render as
# OPENROUTER_API_KEY and is never committed to the repository.
model:
  provider: openrouter
  default: openrouter/free
  base_url: ""
  api_mode: chat_completions

auxiliary:
  free_only: true

gateway:
  api_server:
    enabled: true
    port: 8642
    host: 0.0.0.0
    model_name: akif-hermes
    max_concurrent_runs: 2
