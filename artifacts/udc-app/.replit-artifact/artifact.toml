kind = "web"
previewPath = "/"
title = "UpDownCircle"
description = "A responsive MVP workspace for buyers, sellers, agents, and admins to manage global trade requirements, supply, matches, deals, documents, and communication."
version = "1.0.0"
id = "artifacts/udc-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22599

[services.development]
run = "pnpm --filter @workspace/udc-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/udc-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/udc-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22599"
BASE_PATH = "/"
